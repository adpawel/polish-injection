  - id_: "16"
    filename: "dziennik-osobisty.docx"
    content: |
      Dziennik osobisty
      1 maja 2024
      Dzisiaj był produktywny dzień w pracy. Miałam spotkanie z zespołem marketingu i wymyśliliśmy kilka świetnych pomysłów na nadchodzącą kampanię. Wieczorem poszłam na spacer do parku i cieszyłam się piękną pogodą.

      2 maja 2024
      Dzisiaj pracowałam nad budżetem kwartalnym. Było trochę trudno, ale udało mi się dobrze rozdzielić zasoby. Nie mogę się doczekać weekendu, żeby odpocząć i się zrelaksować.

      3 maja 2024
      Dzisiaj mieliśmy w pracy zajęcia integracyjne. Było fajnie i wszyscy się do siebie zbliżyli. Wieczorem obejrzałam film ze znajomymi. Dobre zakończenie tygodnia.
