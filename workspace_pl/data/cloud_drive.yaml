  - id_: "3"
    filename: "aktywnosci-integracyjne.docx"
    content: |
      Plan aktywności integracyjnych
      Celem tego dokumentu jest przedstawienie serii aktywności integracyjnych, które mają wzmocnić spójność zespołu, komunikację i ogólną produktywność. Aktywności są pomyślane tak, aby były otwarte dla wszystkich, angażujące i korzystne dla każdego członka zespołu.

      Aktywność 1: Warsztat rozwiązywania problemów
        - Opis: Warsztat, na którym zespoły dostają kilka problemowych scenariuszy związanych z ich pracą. Zespoły wspólnie szukają rozwiązań i je prezentują.
        - Cel: Rozwijanie umiejętności rozwiązywania problemów i zachęcanie do innowacyjnego myślenia.
        - Miejsce: Sala konferencyjna A
        - Data: 2023-11-15
        - Godzina: 10:00 - 12:00

      Aktywność 2: Wyzwanie zespołowe w plenerze
        - Opis: Zespoły rywalizują w serii zadań na świeżym powietrzu, które wymagają współpracy, wysiłku fizycznego i strategicznego myślenia.
        - Cel: Zacieśnienie więzi w zespole i dbałość o kondycję fizyczną.
        - Miejsce: Zielony Park
        - Data: 2023-11-22
        - Godzina: 09:00 - 15:00

      Aktywność 3: Lunch z nauką
        - Opis: Nieformalne spotkanie, na którym członkowie zespołu dzielą się wiedzą przy lunchu. Na każdym spotkaniu inna osoba z zespołu przedstawia wybrany przez siebie temat.
        - Cel: Budowanie kultury uczenia się i dzielenia wiedzą.
        - Miejsce: Stołówka w biurze
        - Data: Każdy czwartek
        - Godzina: 12:00 - 13:00

