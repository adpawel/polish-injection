  - id_: "11"
    filename: "zbior-przepisow.docx"
    content: |
      Zbiór przepisów
      Ulubione przepisy Lucasa

      1. Ciasteczka z kawałkami czekolady
         Składniki:
           - 1 szklanka masła, miękkiego
           - 1 szklanka białego cukru
           - 1 szklanka ubitego brązowego cukru
           - 2 jajka
           - 2 łyżeczki ekstraktu waniliowego
           - 3 szklanki mąki pszennej
           - 1 łyżeczka sody oczyszczonej
           - 2 łyżeczki gorącej wody
           - 1/2 łyżeczki soli
           - 2 szklanki kawałków półsłodkiej czekolady
         Przygotowanie:
           1. Rozgrzej piekarnik do 175 stopni C.
           2. Utrzyj masło z białym i brązowym cukrem na gładką masę.
           3. Dodawaj jajka po jednym, ubijając, a potem wmieszaj wanilię.
           4. Rozpuść sodę w gorącej wodzie. Dodaj do ciasta razem z solą.
           5. Wmieszaj mąkę, kawałki czekolady i orzechy. Nakładaj dużymi łyżkami na nienatłuszczone blachy.
           6. Piecz około 10 minut w rozgrzanym piekarniku, aż brzegi ładnie się zrumienią.

      2. Spaghetti carbonara
         Składniki:
           - 200 g spaghetti
           - 100 g pancetty
           - 2 duże jajka
           - 50 g sera pecorino
           - 50 g parmezanu
           - Świeżo mielony czarny pieprz
           - Sól morska
           - 1 ząbek czosnku, obrany, w całości
           - 50 g niesolonego masła
         Przygotowanie:
           1. Nastaw duży garnek z wodą do zagotowania.
           2. Drobno posiekaj pancettę, wcześniej usuwając skórkę.
           3. Drobno zetrzyj oba sery i wymieszaj je ze sobą.
           4. Ubij jajka w średniej misce, dopraw odrobiną świeżo mielonego czarnego pieprzu i odstaw.
           5. Dodaj 1 łyżeczkę soli do wrzącej wody, wrzuć spaghetti, a gdy woda znów się zagotuje, gotuj na małym ogniu.
           6. Zgnieć czosnek płaską stroną noża, tylko lekko.
           7. Roztop masło na średniej patelni, dodaj czosnek i pancettę i smaż na średnim ogniu.
           8. Trzymaj pancettę na małym ogniu. Gdy makaron będzie gotowy, wyjmij go z wody widelcem do makaronu lub szczypcami i przełóż na patelnię z pancettą.
           9. Zdejmij patelnię ze spaghetti i pancettą z ognia.
           10. Szybko wlej jajka z serem. Wymieszaj wszystko szczypcami lub długim widelcem, podnosząc spaghetti, żeby łatwo połączyło się z masą jajeczną, która ma zgęstnieć, ale się nie ściąć, i żeby wszystko było nią pokryte.
           11. Podawaj od razu, posypane resztą sera i odrobiną czarnego pieprzu.

      3. Kurczak curry
         Składniki:
           - 2 łyżki oleju roślinnego
           - 1 duża cebula, posiekana
           - 2 ząbki czosnku, drobno posiekane
           - 1 łyżka imbiru, drobno posiekanego
           - 2 łyżki curry w proszku
           - 1 łyżeczka mielonego kminu rzymskiego
           - 1 łyżeczka mielonej kurkumy
           - 1 łyżeczka mielonej kolendry
           - 1 łyżeczka pieprzu cayenne
           - 1 puszka pomidorów w kostce
           - 1 puszka mleka kokosowego
           - 800g piersi z kurczaka bez skóry i kości, pokrojonej w kawałki
           - Sól i pieprz do smaku
           - 1 łyżka posiekanej świeżej kolendry
         Przygotowanie:
           1. Rozgrzej olej na dużej patelni na średnim ogniu. Dodaj cebulę i czosnek i smaż, aż zmiękną.
           2. Wmieszaj imbir, curry, kmin, kurkumę, kolendrę i cayenne; smaż 1 minutę.
           3. Dodaj pomidory i mleko kokosowe; doprowadź do wrzenia.
           4. Dodaj kurczaka, zmniejsz

